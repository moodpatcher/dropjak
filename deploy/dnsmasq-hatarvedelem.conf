# Dropjak — példa dnsmasq beállítás (nem települ automatikusan)
#
# Cél: a LAN kliensek a kaputól kapjanak DHCP-t és DNS-t. A DNS enélkül is
# működik, ha a kliensek külső szervert használnak — DE a belépés előtt a
# forward irány mindenképp tiltva van, csak a kapu felé menő DNS engedélyezett.
#
# Telepítés:
#   dnf install -y dnsmasq
#   install -m 0644 dnsmasq-hatarvedelem.conf /etc/dnsmasq.d/hatarvedelem.conf
#   # szerkeszd a helyőrzőket, majd:
#   systemctl enable --now dnsmasq
#
# A mellékelt tűzfalszabály már engedi a LAN felől az 53/67-es portot a kapun.

interface=__LAN_IF__
bind-interfaces
except-interface=lo

dhcp-range=__DHCP_START__,__DHCP_END__,255.255.255.0,12h
dhcp-option=option:router,__GW_IP__
dhcp-option=option:dns-server,__GW_IP__

no-resolv
server=1.1.1.1
server=9.9.9.9
domain-needed
bogus-priv
cache-size=1000

# A kapu saját neve (opcionális):
# address=/hatarvedelem.lan/__GW_IP__
