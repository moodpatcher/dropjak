# Dropjak — example dnsmasq configuration (not installed automatically)
#
# Goal: LAN clients receive DHCP and DNS from the gateway. DNS works without
# this too if the clients use an external server — BUT before login the
# forward direction is always blocked; only DNS towards the gateway is
# allowed.
#
# Installation:
#   dnf install -y dnsmasq
#   install -m 0644 dnsmasq-hatarvedelem.conf /etc/dnsmasq.d/hatarvedelem.conf
#   # edit the placeholders, then:
#   systemctl enable --now dnsmasq
#
# The bundled firewall rule already allows ports 53/67 from the LAN to the
# gateway.

interface=__LAN_IF__
bind-interfaces
except-interface=lo

dhcp-range=__DHCP_START__,__DHCP_END__,255.255.255.0,12h
dhcp-option=option:router,__GW_IP__
dhcp-option=option:dns-server,__GW_IP__

no-resolv
server=1.1.1.1
server=9.9.9.9
domain-needed
bogus-priv
cache-size=1000

# The gateway's own name (optional):
# address=/hatarvedelem.lan/__GW_IP__
