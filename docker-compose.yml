# Dropjak — Docker Compose
#
# The .env file must be created from .env.example. The required values
# depend on the mode: HV_WAN_IF is always required; HV_LAN_IF and
# HV_LAN_NET are required only in the default two-NIC mode. With
# HV_SINGLE_NIC=1 (one interface, the WAN is also the client side) they are
# ignored and may be empty. The entrypoint checks the values; the container
# does not start if a required setting is missing. HV_PORTAL_NET defaults
# to 0.0.0.0/0 (public portal).
#
# Important: the container runs in network_mode: host because it must manage
# the VM's forward chain. Therefore there is no ports: mapping, and the portal
# listens on the host's PORT port (8100 by default).
services:
  dropjak:
    container_name: dropjak
    # The build itself must run on the host network: the fail-closed forward
    # chain blocks the build container's egress. Compose cannot grant BuildKit
    # the network.host entitlement, so build the image separately (see the
    # docs) and start it with `docker compose up -d`.
    build:
      context: .
    image: dropjak:2
    restart: unless-stopped
    network_mode: host
    # Deliberately no init: true. tini would run as root, but without CAP_KILL
    # it could not forward SIGTERM to the portal running as UID 999. The
    # entrypoint execs the portal to become PID 1, and it handles SIGTERM,
    # so docker stop shuts down the process cleanly.
    read_only: true

    # The container only gets the necessary capabilities. NET_ADMIN is for
    # the root-side processes only: the entrypoint (rules, watchdog) and the
    # privileged helper (privhelper.py, bounding set NET_ADMIN alone), which
    # runs every nft, conntrack, WireGuard and NFLOG operation for the
    # portal. CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID/SETPCAP are needed
    # exclusively by the entrypoint: to fix the volume permissions and to
    # switch user with setpriv (SETPCAP lets setpriv cut the bounding sets).
    # The portal process holds no capability; NET_BIND_SERVICE stays in its
    # bounding set only when PORT (or the tunnel sync port) is below 1024.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - SETPCAP

    # ip_forward must be enabled on the HOST. We deliberately do not use the
    # compose sysctls setting: with host networking, runc rejects net.* sysctls.
    # docker/setup-host.sh permanently records it in /etc/sysctl.d/90-dropjak.conf.

    environment:
      # 1: single-NIC host. HV_WAN_IF is also the client-facing interface;
      # HV_LAN_IF/HV_LAN_NET are ignored. DHCP, LAN DNS, the HTTP redirect,
      # masquerade, MAC binding and the LAN input block are omitted.
      HV_SINGLE_NIC: ${HV_SINGLE_NIC:-0}
      HV_LAN_IF: ${HV_LAN_IF:-}
      HV_WAN_IF: ${HV_WAN_IF:-}
      HV_LAN_NET: ${HV_LAN_NET:-}
      # Management network: fail2ban exemptions and other management
      # defaults. It does not control portal access and does not allow SSH.
      HV_MGMT_NET: ${HV_MGMT_NET:-}
      # The portal source network. Empty: 0.0.0.0/0, the portal is public
      # (guarded by the admin account, proof-of-work and fail2ban). Set a
      # CIDR to keep it off the WAN.
      HV_PORTAL_NET: ${HV_PORTAL_NET:-}
      # Startup admin account. With HV_ADMIN_ENABLED=1 the container
      # creates the user, or updates it to the given password.
      # WARNING: without an admin account the portal's Admin panel is unreachable, and
      # host SSH stays closed. Set up the account before the first start; create
      # and assign a host (input) rule allowing TCP 22 on the portal, and keep
      # the provider console open.
      HV_ADMIN_ENABLED: ${HV_ADMIN_ENABLED:-0}
      HV_ADMIN_USER: ${HV_ADMIN_USER:-}
      # Prefer the file below: an environment variable is visible in
      # docker inspect and /proc for the container's lifetime. Leave this
      # empty when the file is used (a non-empty variable takes precedence).
      HV_ADMIN_PASSWORD: ${HV_ADMIN_PASSWORD:-}
      # The password file, from the ./secrets directory mounted below
      # (create ./secrets/dropjak_admin_password, mode 0600, owner root).
      # The entrypoint hands a private copy to the portal user.
      HV_ADMIN_PASSWORD_FILE: ${HV_ADMIN_PASSWORD_FILE:-/run/secrets/dropjak_admin_password}
      PORT: ${PORT:-8100}
      # Extra IPv4 networks the gateway never forwards to (comma
      # separated, network addresses), besides the always blocked
      # 169.254.0.0/16: the WAN subnet, the provider's private networks.
      HV_NO_FORWARD_NETS: ${HV_NO_FORWARD_NETS:-}
      # The tunnel agents' sync listener, bound to 10.77.0.1 only; empty:
      # PORT + 1.
      HV_TUNNEL_SYNC_PORT: ${HV_TUNNEL_SYNC_PORT:-}
      HV_PORTAL_URL: ${HV_PORTAL_URL:-}
      # First-start seed for Admin -> Settings -> Proxy, filled by
      # configure.sh's HTTPS mode. Applied only while no settings file
      # exists; the admin UI is authoritative afterwards.
      HV_PROXY_DOMAINS: ${HV_PROXY_DOMAINS:-}
      HV_PORTAL_DOMAIN: ${HV_PORTAL_DOMAIN:-}
      # Further DNS names of the portal (comma separated); the /api/
      # endpoints answer only under these, an IP address, the HV_PORTAL_URL
      # host and the Caddy root domains (DNS rebinding protection).
      HV_PORTAL_HOSTS: ${HV_PORTAL_HOSTS:-}
      HV_SERVICES_FILE: ${HV_SERVICES_FILE:-/opt/hatarvedelem/services.json}
      # State files on the volume. The rules, groups and their
      # assignments are managed by the admin interface.
      HV_RULES: ${HV_RULES:-/var/lib/hatarvedelem/rules.json}
      HV_GROUPS: ${HV_GROUPS:-/var/lib/hatarvedelem/groups.json}
      HV_AUDIT_LOG: ${HV_AUDIT_LOG:-/var/lib/hatarvedelem/audit.jsonl}
      HV_AUDIT_MAX_BYTES: ${HV_AUDIT_MAX_BYTES:-10485760}
      HV_AUDIT_KEEP: ${HV_AUDIT_KEEP:-5}
      # Default access duration; the user can choose in whole
      # hours on the portal, up to 30 days. MIN/MAX can only narrow
      # the range.
      HV_SESSION_TTL: ${HV_SESSION_TTL:-3600}
      HV_MIN_TTL: ${HV_MIN_TTL:-60}
      HV_MAX_TTL: ${HV_MAX_TTL:-2592000}
      HV_AUTH_TTL: ${HV_AUTH_TTL:-600}
      # The issuer/label of the TOTP 2FA otpauth:// URI, if no
      # firewall name is set in the portal (Dropjak by default).
      HV_TOTP_ISSUER: ${HV_TOTP_ISSUER:-Dropjak}
      HV_CHALLENGE_TTL: ${HV_CHALLENGE_TTL:-600}
      HV_POW_DIFFICULTY: ${HV_POW_DIFFICULTY:-4}
      HV_PBKDF2_ITERATIONS: ${HV_PBKDF2_ITERATIONS:-600000}
      HV_RATE_WINDOW: ${HV_RATE_WINDOW:-60}
      HV_RATE_MAX: ${HV_RATE_MAX:-10}
      # Per-account lock across source IPs (LAN clients are never locked).
      HV_ACCOUNT_LOCK_MAX: ${HV_ACCOUNT_LOCK_MAX:-10}
      HV_ACCOUNT_LOCK_WINDOW: ${HV_ACCOUNT_LOCK_WINDOW:-900}
      HV_ACCOUNT_LOCK_BASE: ${HV_ACCOUNT_LOCK_BASE:-60}
      HV_ACCOUNT_LOCK_CAP: ${HV_ACCOUNT_LOCK_CAP:-900}
      # Concurrent portal connections (one thread each): total / per IP.
      HV_MAX_CONNECTIONS: ${HV_MAX_CONNECTIONS:-256}
      HV_MAX_CONNECTIONS_PER_IP: ${HV_MAX_CONNECTIONS_PER_IP:-16}
      HV_FLUSH_ON_START: ${HV_FLUSH_ON_START:-1}
      # Default: 0 (safe). If 1, kernel grants from before the restart
      # can stay alive without a session until the TTL (up to 30 days);
      # this is explicitly NOT safe.
      HV_ALLOW_STALE_GRANTS_ON_START: ${HV_ALLOW_STALE_GRANTS_ON_START:-0}
      # Drop log: the NFLOG group of packets dropped by nftables and the
      # JSONL log on the state volume. With HV_DROP_LOG=0 the portal does not
      # listen on the group (nft rule logging remains).
      HV_DROP_LOG: ${HV_DROP_LOG:-1}
      HV_DROP_LOG_GROUP: ${HV_DROP_LOG_GROUP:-5}
      HV_DROP_LOG_PATH: ${HV_DROP_LOG_PATH:-/var/lib/hatarvedelem/drops.jsonl}
      HV_DROP_LOG_MAX_BYTES: ${HV_DROP_LOG_MAX_BYTES:-10485760}
      HV_DROP_LOG_KEEP: ${HV_DROP_LOG_KEEP:-5}
      # 0 keeps the DHCP / broadcast noise of the provider's flat L2 segment
      # (source 0.0.0.0 or destination 255.255.255.255) in the log.
      HV_DROP_LOG_IGNORE_BROADCAST: ${HV_DROP_LOG_IGNORE_BROADCAST:-1}
      # The pre-auth/block rules configured in the interface.
      HV_SETTINGS: ${HV_SETTINGS:-/var/lib/hatarvedelem/firewall-settings.json}
      # Fail2ban: counting failed logins and banning the source IP.
      # The threshold, time window and ban length can also be set in the interface;
      # these are only the initial defaults for the first start.
      HV_FAIL2BAN: ${HV_FAIL2BAN:-1}
      HV_FAIL2BAN_MAX: ${HV_FAIL2BAN_MAX:-5}
      HV_FAIL2BAN_WINDOW: ${HV_FAIL2BAN_WINDOW:-600}
      HV_FAIL2BAN_BAN: ${HV_FAIL2BAN_BAN:-3600}
      HV_FAIL2BAN_STATE: ${HV_FAIL2BAN_STATE:-/var/lib/hatarvedelem/fail2ban.json}
      # Drop-based banning: port scanners/bots without a login.
      # Gates both metrics at first start; they can be toggled separately
      # at runtime. The threshold is at least 1, there is no 0 = disabled mode.
      HV_FAIL2BAN_DROP: ${HV_FAIL2BAN_DROP:-1}
      HV_FAIL2BAN_DROP_COUNT_ENABLED: ${HV_FAIL2BAN_DROP_COUNT_ENABLED:-1}
      HV_FAIL2BAN_DROP_PORTS_ENABLED: ${HV_FAIL2BAN_DROP_PORTS_ENABLED:-1}
      HV_FAIL2BAN_DROP_MAX: ${HV_FAIL2BAN_DROP_MAX:-120}
      HV_FAIL2BAN_DROP_PORTS: ${HV_FAIL2BAN_DROP_PORTS:-12}
      HV_FAIL2BAN_DROP_WINDOW: ${HV_FAIL2BAN_DROP_WINDOW:-180}
      # Extra addresses/CIDRs a dropped packet can never get banned (comma
      # separated, e.g. agent endpoints); HV_MGMT_NET is always exempt.
      HV_FAIL2BAN_DROP_EXEMPT: ${HV_FAIL2BAN_DROP_EXEMPT:-}
      # Proxy-based banning: the domain proxy's 401 responses; only closes
      # 80/443. Can be set at runtime in the interface.
      HV_FAIL2BAN_PROXY: ${HV_FAIL2BAN_PROXY:-1}
      HV_FAIL2BAN_PROXY_MAX: ${HV_FAIL2BAN_PROXY_MAX:-20}
      HV_FAIL2BAN_PROXY_WINDOW: ${HV_FAIL2BAN_PROXY_WINDOW:-600}
      # The forward mark; the Docker DOCKER-USER guard matches this.
      HV_FWD_MARK: ${HV_FWD_MARK:-0x44524a4b}
      HV_COOKIE_SECURE: ${HV_COOKIE_SECURE:-0}
      HV_DRY_RUN: ${HV_DRY_RUN:-0}
      # Enable/disable the firewall watchdog (0: disabled). It runs
      # root-side in the entrypoint, never in the portal.
      HV_FIREWALL_WATCHDOG: ${HV_FIREWALL_WATCHDOG:-1}
      # 1: the firewall opens TCP 80/443 for the caddy proxy service
      # (together with COMPOSE_PROFILES=proxy). See the .env.example file.
      HV_PROXY: ${HV_PROXY:-0}
      # Secret shared with the caddy service (openssl rand -hex 32), at
      # least 32 characters; mandatory with HV_PROXY=1 (the entrypoint
      # refuses to start without it).
      HV_PROXY_KEY: ${HV_PROXY_KEY:-}
      # 1: login, password and admin endpoints answer 403 to non-LAN
      # sources that did not come through Caddy (HTTPS).
      HV_WAN_HTTPS_ONLY: ${HV_WAN_HTTPS_ONLY:-0}
      # The Caddy admin API Unix socket is on the caddy-admin volume; the portal
      # restarts Caddy through it when ACME is disabled (cache flush).
      HV_CADDY_ADMIN: ${HV_CADDY_ADMIN:-/run/caddy-admin/admin.sock}
      HV_SKIP_FIREWALL: ${HV_SKIP_FIREWALL:-0}
      HV_RUN_AS_ROOT: ${HV_RUN_AS_ROOT:-0}
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      HV_STATE_DIR: /var/lib/hatarvedelem
      HV_NFT_TABLE: hatarvedelem
      HV_NFT_SET: allowed_v4

    volumes:
      - dropjak-state:/var/lib/hatarvedelem
      # The Caddy admin socket; only these two containers mount it.
      - caddy-admin:/run/caddy-admin
      # The host timezone (the challenge "daily" condition uses local midnight;
      # without it the container runs in UTC). The image reads it even
      # without tzdata, and it works with a read-only root as well.
      - /etc/localtime:/etc/localtime:ro
      # Secrets (the admin password file). A directory mount rather than a
      # compose secrets: entry, so a missing file does not stop the start.
      - ./secrets:/run/secrets:ro

    # The root filesystem is read-only; the template's temporary file is
    # created on the /run tmpfs.
    tmpfs:
      - /run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request,sys; p=os.environ.get('PORT','8100'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:%s/api/status' % p, timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: journald
      options:
        tag: dropjak

  # Portal-protected subdomain proxy with automatic HTTPS. Only starts with
  # the COMPOSE_PROFILES=proxy setting; HV_PROXY=1 is also needed to open
  # 80/443. The Caddyfile is static: the paths and authorization are provided
  # per request by the portal's loopback endpoints. The admin API is reachable
  # only through the Unix socket on the caddy-admin volume (no TCP port); the
  # portal requests the stop through it, which restart: unless-stopped restarts.
  caddy:
    container_name: dropjak-caddy
    # Pinned by digest (DJ-20); the tag is kept for readability. Update both
    # on purpose with each release.
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: ["proxy"]
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: ${PORT:-8100}
      HV_PROXY_KEY: ${HV_PROXY_KEY:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-admin:/run/caddy-admin
    depends_on:
      dropjak:
        condition: service_healthy
    logging:
      driver: journald
      options:
        tag: dropjak-caddy

volumes:
  # Fixed name: the volume must stay dropjak-state regardless of the checkout
  # directory (the migration from the old hatarvedelem-state volume is manual).
  dropjak-state:
    name: dropjak-state
  caddy-data:
  caddy-config:
  caddy-admin:
